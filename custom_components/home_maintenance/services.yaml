reset_last_performed:
  name: Reset last performed
  description: Mark a task as performed on a specific date.
  fields:
    entity_id:
      name: Entity ID
      required: true
      selector:
        entity:
          domain: binary_sensor
          integration: home_maintenance
    performed_date:
      name: Performed date
      required: false
      selector:
        date:

create_task:
  name: Create task
  description: Create a recurring maintenance task.
  fields:
    title:
      name: Title
      required: true
      selector:
        text:
    interval_value:
      name: Interval
      required: true
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    interval_type:
      name: Interval type
      required: true
      selector:
        select:
          options:
            - days
            - weeks
            - months
            - years
    description:
      name: Description
      required: false
      selector:
        text:
          multiline: true
    url:
      name: Reference URL
      required: false
      selector:
        text:
    icon:
      name: Icon
      required: false
      selector:
        icon:
    priority:
      name: Priority
      required: false
      selector:
        select:
          options:
            - low
            - normal
            - high
    duration_minutes:
      name: Estimated duration (minutes)
      required: false
      selector:
        number:
          min: 0
          max: 1440
          mode: box
          unit_of_measurement: min
    schedule_mode:
      name: Schedule mode
      description: "interval: next due counts from completion. fixed: keeps the original rhythm (e.g. always Mondays)."
      required: false
      selector:
        select:
          options:
            - interval
            - fixed
    active_months:
      name: Active months
      description: Months (1-12) when the task applies. Empty means all year.
      required: false
      selector:
        select:
          multiple: true
          options:
            - { label: January, value: "1" }
            - { label: February, value: "2" }
            - { label: March, value: "3" }
            - { label: April, value: "4" }
            - { label: May, value: "5" }
            - { label: June, value: "6" }
            - { label: July, value: "7" }
            - { label: August, value: "8" }
            - { label: September, value: "9" }
            - { label: October, value: "10" }
            - { label: November, value: "11" }
            - { label: December, value: "12" }

complete_task:
  name: Complete task
  description: Complete a maintenance task now and add it to history.
  fields:
    entity_id:
      name: Entity ID
      required: true
      selector:
        entity:
          domain: binary_sensor
          integration: home_maintenance

snooze_task:
  name: Snooze task
  description: Postpone the current task without changing its completion history.
  fields:
    entity_id:
      name: Entity ID
      required: true
      selector:
        entity:
          domain: binary_sensor
          integration: home_maintenance
    days:
      name: Days
      required: false
      selector:
        number:
          min: 0
          max: 3650
          mode: box
    hours:
      name: Hours
      description: Snooze for a number of hours instead of (or on top of) days.
      required: false
      selector:
        number:
          min: 0
          max: 720
          mode: box

skip_task:
  name: Skip occurrence
  description: Skip the current occurrence without marking it complete.
  fields:
    entity_id:
      name: Entity ID
      required: true
      selector:
        entity:
          domain: binary_sensor
          integration: home_maintenance

delete_task:
  name: Delete task
  description: Permanently delete a maintenance task.
  fields:
    entity_id:
      name: Entity ID
      required: true
      selector:
        entity:
          domain: binary_sensor
          integration: home_maintenance

set_task_options:
  name: Set task options
  description: Change priority, estimated duration, schedule mode or active months of a task.
  fields:
    entity_id:
      name: Entity ID
      required: true
      selector:
        entity:
          domain: binary_sensor
          integration: home_maintenance
    priority:
      name: Priority
      required: false
      selector:
        select:
          options:
            - low
            - normal
            - high
    duration_minutes:
      name: Estimated duration (minutes)
      required: false
      selector:
        number:
          min: 0
          max: 1440
          mode: box
          unit_of_measurement: min
    schedule_mode:
      name: Schedule mode
      description: "interval: next due counts from completion. fixed: keeps the original rhythm (e.g. always Mondays)."
      required: false
      selector:
        select:
          options:
            - interval
            - fixed
    active_months:
      name: Active months
      description: Months (1-12) when the task applies. Empty means all year.
      required: false
      selector:
        select:
          multiple: true
          options:
            - { label: January, value: "1" }
            - { label: February, value: "2" }
            - { label: March, value: "3" }
            - { label: April, value: "4" }
            - { label: May, value: "5" }
            - { label: June, value: "6" }
            - { label: July, value: "7" }
            - { label: August, value: "8" }
            - { label: September, value: "9" }
            - { label: October, value: "10" }
            - { label: November, value: "11" }
            - { label: December, value: "12" }
