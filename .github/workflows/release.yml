name: Release validation

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release tag matches manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/home_maintenance/manifest.json").read_text()
          )
          release = os.environ["RELEASE_TAG"].removeprefix("v")
          version = manifest["version"].removeprefix("v")
          if release != version:
              raise SystemExit(
                  f"Release tag {release!r} does not match manifest version {version!r}"
              )
          print(f"Release version {version} is consistent")
          PY

      - name: Verify frontend syntax
        run: node --check custom_components/home_maintenance/panel/src/main.js
