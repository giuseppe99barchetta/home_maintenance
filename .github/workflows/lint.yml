name: Lint

on:
  push:
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python3 -m pip install ruff==0.11.13

      - name: Lint
        run: python3 -m ruff check .

      - name: Format probe
        run: |
          python3 -m ruff format .
          git diff -- custom_components/home_maintenance/store.py custom_components/home_maintenance/websocket.py
          git diff --exit-code
