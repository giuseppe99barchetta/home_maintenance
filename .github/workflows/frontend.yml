name: Frontend

on:
  push:
    paths:
      - "custom_components/home_maintenance/panel/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "custom_components/home_maintenance/panel/**"
      - ".github/workflows/frontend.yml"

jobs:
  validate-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify reproducible panel build
        working-directory: custom_components/home_maintenance/panel
        run: npm test
